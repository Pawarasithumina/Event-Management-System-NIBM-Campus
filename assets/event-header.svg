<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 260" width="900" height="260" role="img" aria-label="Event Management System NIBM Campus banner">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b1220"/>
      <stop offset="1" stop-color="#1e1b4b"/>
    </linearGradient>
    <linearGradient id="title" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#60a5fa"/>
      <stop offset="0.55" stop-color="#a78bfa"/>
      <stop offset="1" stop-color="#34d399"/>
    </linearGradient>
    <style>
      text { font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; }
      .title { opacity: 0; animation: rise 1s ease-out .2s forwards; }
      .sub { opacity: 0; animation: rise 1s ease-out .7s forwards; }
      .tag { opacity: 0; animation: rise 1s ease-out 1.1s forwards; }
      .card { animation: bob 4s ease-in-out infinite; }
      .c2 { animation-delay: .6s; } .c3 { animation-delay: 1.2s; }
      .tick { stroke-dasharray: 100; stroke-dashoffset: 100; animation: draw 4s ease-in-out infinite; }
      .t2 { animation-delay: .6s; } .t3 { animation-delay: 1.2s; }
      .dot { animation: float 7s linear infinite; }
      .d2{animation-delay:1.4s}.d3{animation-delay:2.8s}.d4{animation-delay:4.2s}.d5{animation-delay:5.6s}
      @keyframes rise { from { opacity: 0; transform: translateY(14px); } to { opacity: 1; transform: translateY(0); } }
      @keyframes bob { 0%,100% { transform: translateY(0); } 50% { transform: translateY(-12px); } }
      @keyframes draw { 0%,15% { stroke-dashoffset: 100; } 45%,85% { stroke-dashoffset: 0; } 100% { stroke-dashoffset: 100; } }
      @keyframes float { from { transform: translateY(0); opacity: 0; } 15% { opacity: .8; } to { transform: translateY(-230px); opacity: 0; } }
    </style>
  </defs>

  <rect width="900" height="260" rx="18" fill="url(#bg)"/>

  <!-- floating particles -->
  <g fill="#a78bfa" opacity="0.7">
    <circle class="dot"    cx="590" cy="250" r="4"/>
    <circle class="dot d2" cx="640" cy="250" r="3" fill="#60a5fa"/>
    <circle class="dot d3" cx="700" cy="250" r="5" fill="#34d399"/>
    <circle class="dot d4" cx="770" cy="250" r="3"/>
    <circle class="dot d5" cx="850" cy="250" r="4" fill="#60a5fa"/>
  </g>

  <!-- event cards with ticks -->
  <g class="card" transform="translate(650,70)">
    <rect width="64" height="84" rx="10" fill="#172033" stroke="#475569" stroke-width="2"/>
    <rect width="64" height="20" rx="10" fill="#60a5fa"/>
    <rect y="10" width="64" height="10" fill="#60a5fa"/>
    <rect x="12" y="30" width="40" height="5" rx="2.5" fill="#475569"/>
    <path class="tick" pathLength="100" d="M18 60 l9 9 l19 -20" fill="none" stroke="#34d399" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
  <g class="card c2" transform="translate(730,70)">
    <rect width="64" height="84" rx="10" fill="#172033" stroke="#475569" stroke-width="2"/>
    <rect width="64" height="20" rx="10" fill="#a78bfa"/>
    <rect y="10" width="64" height="10" fill="#a78bfa"/>
    <rect x="12" y="30" width="40" height="5" rx="2.5" fill="#475569"/>
    <path class="tick t2" pathLength="100" d="M18 60 l9 9 l19 -20" fill="none" stroke="#34d399" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
  <g class="card c3" transform="translate(810,70)">
    <rect width="64" height="84" rx="10" fill="#172033" stroke="#475569" stroke-width="2"/>
    <rect width="64" height="20" rx="10" fill="#34d399"/>
    <rect y="10" width="64" height="10" fill="#34d399"/>
    <rect x="12" y="30" width="40" height="5" rx="2.5" fill="#475569"/>
    <path class="tick t3" pathLength="100" d="M18 60 l9 9 l19 -20" fill="none" stroke="#34d399" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
  </g>

  <!-- text -->
  <text class="title" x="50" y="105" font-size="42" font-weight="800" fill="url(#title)">Event Management System</text>
  <text class="sub" x="52" y="143" font-size="22" fill="#e2e8f0">NIBM Campus</text>
  <text class="sub" x="52" y="170" font-size="16" fill="#94a3b8">Students register for events · Administrators manage them</text>
  <text class="tag" x="52" y="208" font-size="13" fill="#94a3b8" letter-spacing="3">NODE.JS · EXPRESS.JS · MONGODB ATLAS</text>
</svg>
